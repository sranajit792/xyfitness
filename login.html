<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — XY.FITNESS</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem 0;">

  <!-- Ambient waving background -->
  <div class="ambient-flag-bg"></div>
  <div class="ambient-particles"></div>

  <div class="container-narrow" style="width: 100%; padding: 0 1.5rem;">
    <!-- Logo block -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="brand-logo" style="display: inline-flex; margin-bottom: 0.5rem; justify-content: center;">
        <img src="logo-icon.png" alt="XY.FITNESS Logo Icon">
        <span>XY.FITNESS</span>
      </a>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Empowering your lifestyle with personalized health coaching.</p>
    </div>

    <!-- Login card -->
    <div class="glass-card glow-saffron" style="text-align: center;">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Welcome Back</h2>
      <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 2rem;">Sign in instantly using your Google account to access your dashboard.</p>
      
      <!-- Google Sign In Button -->
      <button id="btn-login-google" class="btn btn-google btn-full" style="margin-bottom: 1.5rem;">
        <!-- Google Icon -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        Sign In with Google
      </button>

      <!-- Redirect -->
      <p style="font-size: 0.85rem; color: var(--text-secondary);">
        New to XY.FITNESS? <a href="signup.html" style="color: var(--accent-saffron); font-weight: 600;">Create an account here</a>
      </p>
    </div>
  </div>

  <!-- Central Config modules -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/toast.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
